# Project name is supplied per-stack via `docker compose -p <project>`.
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wppass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -uroot
        - -p${MYSQL_ROOT_PASSWORD:-rootpass}
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  wordpress:
    # Supplied by the CLI from `dev.version` / `test.version` in `kizlo.config.*`. The
    # fallback is `latest` so a project that has configured nothing gets current
    # WordPress. Worth pinning once a repo commits a generated WordPress client, which
    # is derived from whatever this image serves: on `latest` that client goes stale the
    # day WordPress ships, on whichever PR happens to run next.
    image: wordpress:${WP_IMAGE_TAG:-latest}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wppass}
      # Published host port, handed to Apache so `apache-listen.conf` can add a
      # second listener on it (see that file). Defaulted here to match the port
      # mapping above so a standalone `docker compose up` still parses the config;
      # every path through the CLI supplies the resolved port as WP_PORT.
      WP_PORT: ${WP_PORT:-8080}
      # The wordpress image eval()s WORDPRESS_CONFIG_EXTRA at runtime, and Compose
      # interpolates `$` in this file first — so every PHP variable below is written
      # `$$` to survive Compose and reach PHP as a literal `$`.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        // Dev only: serve under whatever host the request came in on (localhost or a LAN
        // IP) instead of the stored siteurl, so the stack is reachable from other devices
        // on the network, like `next dev`. CLI requests have no HTTP_HOST and fall back to
        // the database value, so wp-cli/bootstrap stay on the canonical URL.
        if (!empty($$_SERVER['HTTP_HOST'])) {
          $$kizlo_scheme = (!empty($$_SERVER['HTTPS']) && $$_SERVER['HTTPS'] !== 'off') ? 'https://' : 'http://';
          define('WP_HOME', $$kizlo_scheme . $$_SERVER['HTTP_HOST']);
          define('WP_SITEURL', $$kizlo_scheme . $$_SERVER['HTTP_HOST']);
        }
    volumes:
      - wp_data:/var/www/html
      # Real PHP upload limits and the extra Apache listener, both shipped next to
      # this file (relative binds resolve against the compose file's directory) and
      # mounted read-only. In the base compose so dev and test stacks both get them.
      - ./uploads.ini:/usr/local/etc/php/conf.d/zz-kizlo-uploads.ini:ro
      - ./apache-listen.conf:/etc/apache2/conf-enabled/zz-kizlo-listen.conf:ro
    healthcheck:
      # Liveness, not a status assertion: the install is in place (what wp-cli needs before
      # it can run anything) and the server answers HTTP at all. Deliberately status-agnostic,
      # because Kizlo's own Headless Mode legitimately 404s the front page, the feeds and the
      # login path. Requiring a 2xx from any WordPress page (`curl -f`) makes an install that is
      # working as configured look dead, and every service gated on this one never starts.
      # curl's own limit is a second under `timeout` below, so a server that accepts the connection
      # and then stalls is reported by curl rather than killed by docker with nothing to show.
      test: ["CMD-SHELL", "test -f /var/www/html/wp-includes/version.php && curl -s -o /dev/null -m 4 http://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  wp-cli:
    # Pinned for the same reason, one layer down: wp-cli drives install, plugin
    # activation and every option write during bootstrap, so a tag that moves changes
    # how the stack is provisioned. It is the tool, not the core, so it tracks its own
    # releases rather than `WP_IMAGE_TAG`.
    image: wordpress:cli-2.12.0-php8.3
    depends_on:
      wordpress:
        condition: service_healthy
    user: "33:33"
    volumes:
      - wp_data:/var/www/html
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wppass}
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    # Kept warm (long-lived) so the harness can `docker compose exec wp-cli wp ...`
    # instead of paying container-startup cost on every wp-cli call.
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  mysql_data:
  wp_data:
