# Kizlo local WordPress — make same-site server requests reach Apache.
#
# WordPress builds internal, server-side requests (e.g. a plugin calling its own
# admin_url()) against the browser-facing URL, which carries the *published* host
# port — say http://localhost:8890. Inside the container that request loops back to
# localhost:8890, but Apache only listens on 80 (Docker maps the host port to 80),
# so the call fails with cURL error 7 and the plugin stalls.
#
# Listening on the published port as well makes localhost:<port> resolve inside the
# container exactly as it does from the browser. Apache keeps its port-80 listener
# for Docker's port mapping and the health check; this only adds a second one.
#
# WP_PORT is passed into the wordpress service by the CLI (and defaulted in the base
# Compose file), so Apache expands ${WP_PORT} from the container environment.
Listen ${WP_PORT}
