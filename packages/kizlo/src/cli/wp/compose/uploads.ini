; Kizlo local WordPress — raise PHP's upload ceiling for large imports.
;
; PHP rejects an oversized request before WordPress (or an upload plugin) ever
; sees it, so a WordPress hook that only changes the *displayed* limit is not
; enough. These are the real server limits the local stacks enforce.
;
; post_max_size is deliberately larger than upload_max_filesize: a file upload
; arrives as a multipart POST, so the whole request is a little bigger than the
; file itself. 2100M leaves headroom above the 2G (2048M) file limit for that
; envelope. Nothing else (memory_limit, execution time) is touched.
upload_max_filesize=2G
post_max_size=2100M
