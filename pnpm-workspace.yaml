packages:
  - web
  - packages/*
  - tooling/*
  - plugins/*
  - templates/*

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  core-js-pure: true
  esbuild: true
  sharp: true
  unrs-resolver: true

catalog:
  dotenv-cli: ^11.0.0
  next: ^16.2.9
  astro: ^7.1.3
  '@astrojs/node': ^11.0.2
  '@tanstack/react-router': ^1.170.41
  '@tanstack/react-start': ^1.168.60
  '@tanstack/solid-router': ^1.170.38
  '@tanstack/solid-start': ^1.168.57
  '@tanstack/router-plugin': ^1.168.23
  '@tanstack/router-cli': ^1.167.21
  vite: ^8.1.5
  '@vitejs/plugin-react': ^6.0.4
  vite-plugin-solid: ^2.11.10
  solid-js: ^1.9.9
  jose: 6.1.0
  zod: ^4.3.6
  tsdown: ^0.15.6
  vitest: ^3.2.4
  typescript: ^5.9.3
  '@types/node': ^22.18.12
  '@oslojs/crypto': ^1.0.1

catalogs:
  react19:
    react: ^19.2.3
    react-dom: ^19.2.3
    '@types/react': ^19.2.3
    '@types/react-dom': ^19.2.3

overrides:
  '@tanstack/react-start@<1.168.60': 1.168.60
  '@tanstack/start-server-core@<1.169.39': 1.169.39

packageExtensions:
  '@hookform/resolvers@*':
    peerDependencies:
      zod: ^4.0.0

minimumReleaseAgeExclude:
  - '@next/third-parties@16.3.7'
  - kizlo@0.23.0

onlyBuiltDependencies:
  - sharp
  - esbuild
  - core-js
  - core-js-pure
  - unrs-resolver
  - "@parcel/watcher"
